name: Build FF External IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=""
          for ver in Xcode_16.3 Xcode_16.2 Xcode_16.1 Xcode_16; do
            if [ -d "/Applications/${ver}.app" ]; then
              XCODE_PATH="/Applications/${ver}.app"
              break
            fi
          done
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          xcodebuild -version

      - name: Verify repo structure
        run: |
          echo "=== Repo structure ==="
          find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -maxdepth 4
          find "$GITHUB_WORKSPACE" -name "*.swift" -maxdepth 6 | sort
          echo "=== Resources folder ==="
          ls -la "$GITHUB_WORKSPACE/FFExternal/Resources/" 2>/dev/null || echo "No Resources folder yet"

      - name: Resolve project path
        id: paths
        run: |
          PROJ=$(find "$GITHUB_WORKSPACE" -name "FFExternal.xcodeproj" -maxdepth 4 | head -1)
          PROJ_DIR=$(dirname "$PROJ")
          echo "PROJ=$PROJ"         >> $GITHUB_OUTPUT
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "Project: $PROJ"

      - name: Validate pbxproj
        run: |
          PBXPROJ="${{ steps.paths.outputs.PROJ_DIR }}/FFExternal.xcodeproj/project.pbxproj"
          for entry in "CheatSettings.swift" "SecurityBind.swift" "AntiDebug.swift" "StringObfuscator.swift" \
                       "DesignSystem.swift" "LanguagePickerView.swift" "LoginView.swift" "MainMenuView.swift"; do
            if grep -q "$entry" "$PBXPROJ"; then
              echo "  ✓ $entry"
            else
              echo "  ✗ MISSING: $entry"
              exit 1
            fi
          done
          echo "All files registered."

      - name: List schemes
        run: |
          cd "${{ steps.paths.outputs.PROJ_DIR }}"
          xcodebuild -project FFExternal.xcodeproj -list 2>&1 || true

      - name: Install SwiftShield
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSVER=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/rockbruno/swiftshield/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4)
          if [ -z "$SSVER" ]; then SSVER="3.14.3"; fi
          echo "SwiftShield $SSVER"
          curl -fL "https://github.com/rockbruno/swiftshield/releases/download/${SSVER}/swiftshield.zip" \
            -o /tmp/ss.zip
          unzip -o /tmp/ss.zip -d /tmp/swiftshield
          SS_BIN=$(find /tmp/swiftshield -name "swiftshield" -type f | grep -v dSYM | head -1)
          chmod +x "$SS_BIN"
          echo "$(dirname "$SS_BIN")" >> $GITHUB_PATH

      - name: Obfuscate Swift symbols
        run: |
          cd "${{ steps.paths.outputs.PROJ_DIR }}"
          swiftshield obfuscate \
            --project-root . \
            --scheme FFExternal \
            --output-path "$RUNNER_TEMP/obfuscated" \
            --ignore-files "App.swift,DesignSystem.swift,CheatSettings.swift,AntiDebug.swift" \
            2>&1 | tee /tmp/swiftshield.log || true

          if [ -d "$RUNNER_TEMP/obfuscated" ]; then
            echo "SS_PROJ_DIR=$RUNNER_TEMP/obfuscated" >> $GITHUB_ENV
          else
            echo "SwiftShield fallback — building from source"
            echo "SS_PROJ_DIR=${{ steps.paths.outputs.PROJ_DIR }}" >> $GITHUB_ENV
          fi


      - name: Compile FFCheat.dll
        run: |
          # Install Mono for C# compilation
          brew install mono 2>/dev/null || true

          MCS=$(which mcs 2>/dev/null)
          if [ -z "$MCS" ]; then
            echo "mcs not found, trying alternative"
            MCS=$(find /usr /opt /Library -name "mcs" 2>/dev/null | head -1)
          fi

          echo "Using mcs: $MCS"

          # Find UnityEngine.dll from Unity installation
          UNITY_DLL=$(find /Applications/Unity -name "UnityEngine.dll" 2>/dev/null | head -1)

          # If Unity not installed, download managed stubs from Unity archive
          if [ -z "$UNITY_DLL" ]; then
            echo "Unity not found, downloading UnityEngine stubs..."
            mkdir -p "$RUNNER_TEMP/unity_managed"
            # Download Unity 2020.3.48 managed DLLs (LTS, matches FF Unity version)
            UNITY_URL="https://download.unity3d.com/download_unity/b805b124c6b7/MacEditorInstaller/Unity.pkg"
            # Use nuget package instead - faster
            cd "$RUNNER_TEMP/unity_managed"
            curl -fLs "https://globalcdn.nuget.org/packages/unity3d.unityengine.1.0.0.nupkg"               -o unity_stubs.nupkg 2>/dev/null || true

            # Alternative: use Unity's built-in stubs from package
            # Download just the managed folder from Unity
            curl -fLs "https://github.com/Unity-Technologies/UnityCsReference/archive/refs/heads/2020.3.nupkg"               -o stubs.zip 2>/dev/null || true

            UNITY_DLL=""
          fi

          # Last resort: create minimal UnityEngine.dll stub for compilation
          if [ -z "$UNITY_DLL" ] || [ ! -f "$UNITY_DLL" ]; then
            echo "Creating UnityEngine stubs..."
            mkdir -p "$RUNNER_TEMP/stubs"
            cat > "$RUNNER_TEMP/stubs/UnityEngineStub.cs" << 'STUBEOF'
namespace UnityEngine {
    public class Object { public string name; public static void Destroy(Object o) {} public static void DontDestroyOnLoad(Object o) {} }
    public class Component : Object { public GameObject gameObject; public Transform transform; public T GetComponent<T>() where T : Component { return null; } public object GetComponent(string t) { return null; } }
    public class Behaviour : Component { public bool enabled; }
    public class MonoBehaviour : Behaviour { public void StartCoroutine(System.Collections.IEnumerator r) {} }
    public class GameObject : Object {
        public Transform transform; public string tag;
        public GameObject(string n) { name = n; }
        public static GameObject[] FindGameObjectsWithTag(string t) { return new GameObject[0]; }
        public T AddComponent<T>() where T : Component { return null; }
        public T GetComponent<T>() where T : Component { return null; }
        public object GetComponent(string t) { return null; }
    }
    public class Transform : Component {
        public Vector3 position; public Quaternion rotation; public Vector3 right;
        public Vector3 forward; public Vector3 up;
    }
    public struct Vector3 {
        public float x, y, z;
        public Vector3(float x, float y, float z) { this.x=x; this.y=y; this.z=z; }
        public static Vector3 zero = new Vector3(0,0,0);
        public static Vector3 up   = new Vector3(0,1,0);
        public float magnitude { get { return UnityEngine.Mathf.Sqrt(x*x+y*y+z*z); } }
        public Vector3 normalized { get { float m=magnitude; return m>0?new Vector3(x/m,y/m,z/m):zero; } }
        public static float Distance(Vector3 a, Vector3 b) { return (a-b).magnitude; }
        public static Vector3 operator+(Vector3 a, Vector3 b) { return new Vector3(a.x+b.x,a.y+b.y,a.z+b.z); }
        public static Vector3 operator-(Vector3 a, Vector3 b) { return new Vector3(a.x-b.x,a.y-b.y,a.z-b.z); }
        public static Vector3 operator*(Vector3 a, float f) { return new Vector3(a.x*f,a.y*f,a.z*f); }
    }
    public struct Vector2 { public float x, y; public Vector2(float x, float y){this.x=x;this.y=y;} }
    public struct Quaternion {
        public float x,y,z,w;
        public static Quaternion identity = new Quaternion();
        public static Quaternion LookRotation(Vector3 d) { return identity; }
        public static Quaternion Slerp(Quaternion a, Quaternion b, float t) { return a; }
    }
    public struct Rect { public float x,y,width,height; public Rect(float x,float y,float w,float h){this.x=x;this.y=y;width=w;height=h;} }
    public struct Color { public float r,g,b,a; public Color(float r,float g,float b,float a=1){this.r=r;this.g=g;this.b=b;this.a=a;}
        public static Color red=new Color(1,0,0); public static Color green=new Color(0,1,0);
        public static Color white=new Color(1,1,1); public static Color black=new Color(0,0,0);
        public static Color cyan=new Color(0,1,1); public static Color yellow=new Color(1,1,0);
        public static Color Lerp(Color a, Color b, float t) { return new Color(a.r+(b.r-a.r)*t,a.g+(b.g-a.g)*t,a.b+(b.b-a.b)*t); }
    }
    public class Camera : Behaviour {
        public static Camera main;
        public Transform transform;
        public Vector3 WorldToScreenPoint(Vector3 p) { return Vector3.zero; }
    }
    public class Texture2D : Object {
        public Texture2D(int w, int h) {} public Texture2D(int w, int h, TextureFormat f, bool m) {}
        public void SetPixel(int x, int y, Color c) {} public void Apply() {}
    }
    public enum TextureFormat { RGBA32 }
    public enum FontStyle { Normal, Bold, Italic, BoldAndItalic }
    public enum TextAnchor { UpperLeft, UpperCenter, UpperRight, MiddleLeft, MiddleCenter, MiddleRight, LowerLeft, LowerCenter, LowerRight }
    public class GUIStyle { public int fontSize; public FontStyle fontStyle; public TextAnchor alignment; public GUIStyleState normal=new GUIStyleState(); public GUIStyle(){} public GUIStyle(GUIStyle s){} }
    public class GUIStyleState { public Color textColor; public Texture2D background; }
    public static class GUIContent { public static GUIContent none=null; }
    public static class GUI {
        public static Color color;
        public static void DrawTexture(Rect r, Texture2D t) {}
        public static void Label(Rect r, string s, GUIStyle st) {}
        public static void Box(Rect r, GUIContent c, GUIStyle st) {}
    }
    public static class GUIUtility {
        public static void RotateAroundPivot(float angle, Vector3 pivot) {}
    }
    public class Event { public static Event current; public EventType type; }
    public enum EventType { Repaint, Layout, MouseDown, MouseUp, KeyDown, KeyUp }
    public static class Time { public static float time; public static float deltaTime; public static float timeScale; public static float fixedDeltaTime; }
    public static class Screen { public static int width; public static int height; }
    public static class Application { public static int targetFrameRate; public static string persistentDataPath=""; }
    public static class Mathf {
        public static float Sqrt(float f) { return (float)System.Math.Sqrt(f); }
        public static float Clamp(float v, float min, float max) { return v<min?min:v>max?max:v; }
        public static float Atan2(float y, float x) { return (float)System.Math.Atan2(y,x); }
        public static float Min(float a, float b) { return a<b?a:b; }
        public static float Abs(float f) { return f<0?-f:f; }
        public const float Rad2Deg = 57.29578f;
        public const float PI = 3.14159265f;
    }
    public static class Debug { public static void Log(object o) {} }
    public static class Vector3Extensions {
        public static float Distance(Vector3 a, Vector3 b) { return (a-b).magnitude; }
    }
    public class CharacterController : Component { public Vector3 velocity; public float radius; public void Move(Vector3 motion){} public void SimpleMove(Vector3 speed){} }
    public class Rigidbody : Component { public Vector3 velocity; }
    public static class Physics { public static bool Raycast(Vector3 origin, Vector3 dir, out RaycastHit hit, float dist) { hit=new RaycastHit(); return false; } }
    public struct RaycastHit { public Vector3 point; public Transform transform; }
}
STUBEOF

            mcs "$RUNNER_TEMP/stubs/UnityEngineStub.cs"               -target:library               -out:"$RUNNER_TEMP/stubs/UnityEngine.dll"

            UNITY_DLL="$RUNNER_TEMP/stubs/UnityEngine.dll"
            echo "UnityEngine stub compiled: $(ls -la $UNITY_DLL)"
          fi

          echo "Compiling FFCheat.dll..."
          CHEAT_SRC="${{ steps.paths.outputs.PROJ_DIR }}/../FFCheat"
          if [ ! -d "$CHEAT_SRC" ]; then
            CHEAT_SRC="${GITHUB_WORKSPACE}/FFCheat"
          fi

          echo "Cheat source dir: $CHEAT_SRC"
          ls "$CHEAT_SRC/" 2>/dev/null || echo "Directory not found"

          $MCS             "$CHEAT_SRC/FFCheatConfig.cs"             "$CHEAT_SRC/FFCheatESP.cs"             "$CHEAT_SRC/FFCheatAim.cs"             "$CHEAT_SRC/FFCheatMovement.cs"             "$CHEAT_SRC/FFCheatHUD.cs"             "$CHEAT_SRC/FFCheatLoader.cs"             -r:"$UNITY_DLL"             -target:library             -optimize+             -out:"$RUNNER_TEMP/FFCheat.dll"

          if [ -f "$RUNNER_TEMP/FFCheat.dll" ]; then
            echo "✓ FFCheat.dll compiled: $(ls -lh $RUNNER_TEMP/FFCheat.dll)"
            echo "FFCHEAT_DLL=$RUNNER_TEMP/FFCheat.dll" >> $GITHUB_ENV
          else
            echo "✗ FFCheat.dll compilation failed"
            exit 1
          fi

      - name: Build (unsigned + hardened + size obfuscated)
        run: |
          set -o pipefail
          BUILD_DIR="${SS_PROJ_DIR:-${{ steps.paths.outputs.PROJ_DIR }}}"
          cd "$BUILD_DIR"

          BUILD_OUT="$RUNNER_TEMP/build_output"

          xcodebuild build \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SDKROOT=iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            ENABLE_TESTABILITY=NO \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            COPY_PHASE_STRIP=YES \
            GCC_SYMBOLS_PRIVATE_EXTERN=YES \
            CONFIGURATION_BUILD_DIR="$BUILD_OUT" \
            2>&1 | tee /tmp/xcodebuild.log

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== BUILD FAILED — last 400 lines ==="
            tail -400 /tmp/xcodebuild.log
            exit $BUILD_EXIT
          fi

          echo "BUILD_OUT=$BUILD_OUT" >> $GITHUB_ENV

      - name: Show build log on failure
        if: failure()
        run: |
          tail -500 /tmp/xcodebuild.log || true
          cat /tmp/swiftshield.log || true



      - name: Package IPA
        run: |
          BUILD_OUT="${BUILD_OUT:-$RUNNER_TEMP/build_output}"
          APP_PATH=$(find "$BUILD_OUT" -name "FFExternal.app" -maxdepth 4 | head -1)

          if [ -z "$APP_PATH" ]; then
            # fallback: search derived data
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "FFExternal.app" -not -path "*.dSYM/*" | head -1)
          fi

          echo "App: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find "$RUNNER_TEMP" -name "*.app" 2>/dev/null | head -10
            exit 1
          fi

          IPA_STAGING="$RUNNER_TEMP/IPAStaging/Payload"
          mkdir -p "$IPA_STAGING"
          cp -R "$APP_PATH" "$IPA_STAGING/"

          # Resources padding removed - causes Esign timeout on large IPA

          cd "$RUNNER_TEMP/IPAStaging"
          zip -r "$RUNNER_TEMP/FFExternal.ipa" Payload/

          IPA_BYTES=$(wc -c < "$RUNNER_TEMP/FFExternal.ipa")
          echo "IPA size: $(du -sh "$RUNNER_TEMP/FFExternal.ipa" | cut -f1) ($IPA_BYTES bytes)"

      - name: Package cheat files
        run: |
          mkdir -p "$RUNNER_TEMP/cheat_files"
          # FFCheat.dll - our compiled cheat
          if [ -f "$FFCHEAT_DLL" ]; then
            cp "$FFCHEAT_DLL" "$RUNNER_TEMP/cheat_files/FFCheat.dll"
          fi
          # localConfig.json template
          cat > "$RUNNER_TEMP/cheat_files/localConfig.json" << 'JSONEOF'
{"aimbot":false,"aimSilent":false,"fovCircle":false,"speedHack":false,"bulletSpeed":false,"fps144":false,"streamproof":false,"espBox":false,"espLine":false,"espHealth":false,"espName":false,"espDistance":false,"espSkeleton":false,"enemyCounter":false,"fovRadius":100,"aimbotStrength":60,"aimbotTarget":0,"enemyDistance":150,"speedMultiplier":5,"bulletMultiplier":10}
JSONEOF
          echo "Cheat files:"
          ls -la "$RUNNER_TEMP/cheat_files/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-${{ github.run_number }}
          path: ${{ runner.temp }}/FFExternal.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload Cheat Files
        uses: actions/upload-artifact@v4
        with:
          name: CheatFiles-${{ github.run_number }}
          path: ${{ runner.temp }}/cheat_files/
          retention-days: 30
          if-no-files-found: warn
